// Top-level build file
plugins {
    id 'com.android.application' version '9.3.3' apply false
    id 'org.jetbrains.kotlin.android' version '2.2.10' apply false
}

// Keep Gradle/AGP intermediates on a path without spaces (see gradle.properties).
def externalBuildRoot = providers.gradleProperty("barky.buildRoot")
        .orElse("C:/AndroidBuilds/barky")
        .get()
layout.buildDirectory.set(file("${externalBuildRoot}/root"))
