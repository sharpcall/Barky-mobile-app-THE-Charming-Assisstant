org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Use Android Studio’s bundled JBR for Gradle (matches IDE “Gradle JDK”).
# Avoids spawning a second daemon when system JAVA_HOME is something else (e.g. jdk-25).
# If you install Studio elsewhere, update this path — or delete this line to use JAVA_HOME.
# Revert note: remove/comment org.gradle.java.home to fall back to JAVA_HOME / Studio UI setting.
org.gradle.java.home=C:/Program Files/Android/Android Studio2/jbr

# Put intermediates outside the project tree. Paths under "F:\To sort\..."
# break aapt2 ("system cannot find the path specified") because of the space.
# Do not put a space in this path.
barky.buildRoot=C:/AndroidBuilds/barky

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false
